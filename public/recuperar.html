<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar acesso | Trilha Aprova</title><link rel="stylesheet" href="/store.css"><link rel="stylesheet" href="/trilha.css"></head><body><main class="status-page"><section class="status-card"><img src="/assets/trilha-aprova-logo.webp" alt="Trilha Aprova" style="width:132px;height:68px;object-fit:contain;margin-bottom:8px"><div class="eyebrow">RECUPERAÇÃO DE ACESSO</div><h1>Perdeu seu link?</h1><p>Digite exatamente o mesmo e-mail utilizado no pagamento. Se encontrarmos uma compra aprovada, enviaremos novamente o acesso ao material adquirido.</p><form class="recover-form" id="recover-form"><input id="email" type="email" required autocomplete="email" placeholder="seuemail@exemplo.com"><button class="button-link" type="submit">Reenviar acesso</button></form><p id="recover-status" class="legal-note">Por segurança, a tela não informa se um e-mail possui ou não uma compra.</p><div class="status-actions"><a class="button-link alt" href="/">Voltar à Trilha Aprova</a></div></section></main><script>(()=>{const form=document.getElementById('recover-form'),status=document.getElementById('recover-status');form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button'),email=document.getElementById('email').value.trim();button.disabled=true;button.textContent='Enviando...';try{await fetch('/api/recover-access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});status.textContent='Se houver uma compra aprovada para esse e-mail, o novo acesso será enviado. Verifique também spam e promoções.'}catch{status.textContent='Não foi possível processar a solicitação agora. Tente novamente em alguns minutos.'}button.disabled=false;button.textContent='Reenviar acesso'}})();</script><script src="/analytics-crm.js" defer></script></body></html>
