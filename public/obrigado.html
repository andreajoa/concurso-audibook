<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pagamento confirmado | Trilha Aprova</title><link rel="stylesheet" href="/store.css"><link rel="stylesheet" href="/trilha.css"></head><body><main class="status-page"><section class="status-card"><img src="/assets/trilha-aprova-logo.webp" alt="Trilha Aprova" style="width:130px;height:66px;object-fit:contain;margin-bottom:6px"><div class="status-icon">✓</div><div class="eyebrow">PAGAMENTO</div><h1 id="status-title">Confirmando sua compra...</h1><p id="status-text">Estamos consultando a Stripe. Isso costuma levar apenas alguns segundos.</p><div class="status-actions" id="status-actions" hidden><a class="button-link" id="access-now" href="#">Acessar minha trilha</a><button class="button-link alt" id="copy-link" type="button">Copiar meu link</button></div><p class="legal-note" id="status-note">Não feche esta página até a confirmação aparecer.</p></section></main><script>(()=>{const q=new URLSearchParams(location.search),sid=q.get('session_id'),title=document.getElementById('status-title'),text=document.getElementById('status-text'),actions=document.getElementById('status-actions'),link=document.getElementById('access-now'),copy=document.getElementById('copy-link'),note=document.getElementById('status-note');async function run(){if(!sid){title.textContent='Não encontramos o pagamento.';text.textContent='Abra novamente o link enviado após a compra ou use a recuperação de acesso.';note.innerHTML='<a class="recover-link" href="/recuperar.html">Recuperar meu acesso</a>';return}try{const r=await fetch('/api/order-status?session_id='+encodeURIComponent(sid),{cache:'no-store'}),d=await r.json();if(!d.paid){title.textContent='Pagamento ainda em processamento.';text.textContent='Se o método escolhido levar alguns instantes para confirmar, aguarde e atualize esta página.';note.innerHTML='<a class="recover-link" href="/recuperar.html">Já paguei e preciso recuperar o acesso</a>';return}const access='/acesso?session_id='+encodeURIComponent(sid);link.href=access;actions.hidden=false;title.textContent='Pagamento confirmado. Sua trilha está liberada.';text.textContent='Você já pode abrir a apostila, escutar o audiobook e baixar os arquivos incluídos no seu material.';note.textContent='Guarde o e-mail enviado após a compra. Se perder o acesso, ele pode ser recuperado pelo mesmo e-mail usado no pagamento.';copy.onclick=async()=>{await navigator.clipboard.writeText(location.origin+access);copy.textContent='Link copiado ✓';setTimeout(()=>copy.textContent='Copiar meu link',2000)}}catch(e){console.error(e);title.textContent='Estamos finalizando a confirmação.';text.textContent='Atualize esta página em alguns instantes. Nenhuma nova cobrança será feita.';}}run()})();</script><script src="/analytics-crm.js" defer></script></body></html>
