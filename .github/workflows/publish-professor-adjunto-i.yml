name: Publish Professor Adjunto I — Santos 2026

on:
  push:
    branches:
      - ops/professor-adjunto-i-santos-2026
    paths:
      - .github/workflows/publish-professor-adjunto-i.yml

permissions:
  contents: write

concurrency:
  group: publish-professor-adjunto-i-2026
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current production main
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests boto3 pymupdf pillow piper-tts

      - name: Reuse verified private media and prepare current storefront
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import scripts.publish_professor_adjunto_i as p

          s3 = p.r2_client()
          p.PUBLIC_COVER.parent.mkdir(parents=True, exist_ok=True)

          keys = [p.PDF_KEY, p.COVER_KEY, p.SUMMARY_KEY]
          keys += [f'{p.AUDIO_PREFIX}/{stem}.mp3' for stem, *_ in p.CHAPTERS]
          for key in keys:
              info = s3.head_object(Bucket=p.BUCKET, Key=key)
              if int(info.get('ContentLength') or 0) <= 0:
                  raise RuntimeError(f'Private asset missing or empty: {key}')
              print(f'PRIVATE ASSET OK {key}: {info["ContentLength"]} bytes', flush=True)

          if p.remote_sha(s3, p.PDF_KEY) != p.PDF_SHA:
              raise RuntimeError('Private Professor PDF differs from validated source')
          if p.remote_sha(s3, p.COVER_KEY) != p.COVER_SHA:
              raise RuntimeError('Private Professor cover differs from validated source')
          if p.remote_sha(s3, p.SUMMARY_KEY) != p.SUMMARY_SHA:
              raise RuntimeError('Private Professor summary differs from validated source')

          s3.download_file(p.BUCKET, p.COVER_KEY, str(p.PUBLIC_COVER))
          if p.sha256(p.PUBLIC_COVER) != p.COVER_SHA:
              raise RuntimeError('Public cover copy changed bytes')
          with p.Image.open(p.PUBLIC_COVER) as image:
              image.verify()
          with p.Image.open(p.PUBLIC_COVER) as image:
              if image.size != (1122, 1402) or image.mode != 'RGBA':
                  raise RuntimeError(f'Unexpected cover properties: {image.size} {image.mode}')

          catalog_path = Path('products/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          product = p.product_definition()
          # The current generator uses seoTitle directly; the one-shot publisher
          # predates that field and called it metaTitle.
          meta_title = product.pop('metaTitle', 'Professor Adjunto I Santos 2026 + audiobook')
          product['seoTitle'] = meta_title + ' | Trilha Aprova'
          catalog[p.SLUG] = product
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n')

          stored = json.loads(catalog_path.read_text())[p.SLUG]
          if not stored.get('active') or len(stored['assets']['chapters']) != 8:
              raise RuntimeError('Professor product was not prepared correctly')
          if not stored['storefront']['cover3d'].endswith('/assets/apostila-professor-adjunto-i-3d.png'):
              raise RuntimeError('Professor storefront cover URL is wrong')
          print('STOREFRONT SOURCES READY: existing private media reused; product added to current catalog with binary cover', flush=True)
          PY

      - name: Restore production API before commit
        run: |
          set -euo pipefail
          git checkout origin/main -- api/cover.js

      - name: Add permanent product integrity test
        run: |
          cat > tests/professor-adjunto-i-product.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const slug = 'professor-adjunto-i-ibam-santos-2026';
          const catalog = require('../products/catalog.json');
          const product = catalog[slug];
          const coverPath = 'public/assets/apostila-professor-adjunto-i-3d.png';

          test('Professor Adjunto I is a complete sellable product with isolated private assets', () => {
            assert.ok(product);
            assert.equal(product.active, true);
            assert.equal(product.priceCents, 2499);
            assert.equal(product.assets.chapters.length, 8);
            const keys = [product.assets.pdfKey, product.assets.coverKey, product.assets.summary.key,
              ...product.assets.chapters.map(track => track.key)];
            assert.equal(keys.length, 11);
            assert.equal(new Set(keys).size, 11);
            assert.ok(keys.every(key => key.startsWith(slug + '/')));
          });

          test('Professor cover is the validated real PNG binary supplied for the product', () => {
            const bytes = fs.readFileSync(coverPath);
            assert.equal(bytes.subarray(0, 8).toString('hex'), '89504e470d0a1a0a');
            assert.equal(bytes.readUInt32BE(16), 1122);
            assert.equal(bytes.readUInt32BE(20), 1402);
            assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),
              'ffb24a6d1c9a8cc8eda4eaadc37a68a6474e105f07d9790c77bbb416f85da013');
          });

          test('Professor storefront page uses a normal binary URL, never an inline data URI', () => {
            const page = fs.readFileSync('public/apostilas/' + slug + '.html', 'utf8');
            assert.match(page, /Professor Adjunto I/);
            assert.match(page, /apostila-professor-adjunto-i-3d\.png/);
            assert.doesNotMatch(page, /data:image\//i);
            assert.doesNotMatch(page, /Esta apostila trabalha redação para candidatos de ensino fundamental completo/);
            const title = page.match(/<title>(.*?)<\/title>/s)?.[1] || '';
            assert.ok(title.length > 20 && title.length <= 60, title);
          });
          EOF

      - name: Build test and audit storefront
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node --test tests/professor-adjunto-i-product.test.cjs
          test -f public/apostilas/professor-adjunto-i-ibam-santos-2026.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          cover=Path('public/assets/apostila-professor-adjunto-i-3d.png').read_bytes()
          assert cover[:8] == b'\x89PNG\r\n\x1a\n'
          assert len(cover) == 2226830
          assert hashlib.sha256(cover).hexdigest() == 'ffb24a6d1c9a8cc8eda4eaadc37a68a6474e105f07d9790c77bbb416f85da013'
          catalog=json.loads(Path('products/catalog.json').read_text())
          p=catalog['professor-adjunto-i-ibam-santos-2026']
          assert p['active'] is True and len(p['assets']['chapters']) == 8
          page=Path('public/apostilas/professor-adjunto-i-ibam-santos-2026.html').read_text()
          assert 'Professor Adjunto I' in page and 'R$ 24,99' in page
          assert 'data:image/' not in page and ';base64,' not in page
          title=re.search(r'<title>(.*?)</title>',page,re.S).group(1)
          assert len(title) <= 60, (len(title),title)
          print('Professor storefront audit OK:', title)
          PY

      - name: Remove one-shot staging machinery
        run: |
          set -euo pipefail
          git rm -f .github/workflows/publish-professor-adjunto-i.yml scripts/publish_professor_adjunto_i.py

      - name: Commit production-ready storefront and normal binary cover
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git add api/cover.js products/catalog.json scripts/build-seo.cjs public tests/professor-adjunto-i-product.test.cjs
          git add -f public/assets/apostila-professor-adjunto-i-3d.png
          git diff --cached --check

          if git diff --cached --name-only | grep -E '\.(pdf|mp3|m4a|wav)$'; then
            echo 'Paid binary media must never be committed to the public repository.' >&2
            exit 1
          fi

          test "$(git diff --cached --numstat -- public/assets/apostila-professor-adjunto-i-3d.png | awk '{print $1" "$2}')" = '- -'
          git diff --cached --binary -- public/assets/apostila-professor-adjunto-i-3d.png > /tmp/professor-cover.patch
          grep -q '^GIT binary patch' /tmp/professor-cover.patch

          if git grep -n -E 'data:image/[^;]+;base64' -- public products scripts tests; then
            echo 'Inline Base64 image found in production sources.' >&2
            exit 1
          fi

          git commit -m 'feat: publish Professor Adjunto I Santos 2026 with audiobook'
          git push origin HEAD:ops/professor-adjunto-i-santos-2026
