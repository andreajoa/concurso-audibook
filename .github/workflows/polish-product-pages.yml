name: Polish product pages before release

on:
  push:
    branches:
      - ops/secretario-unidade-escolar-2026
    paths:
      - .github/workflows/polish-product-pages.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Correct product-fit FAQ and remove obsolete Floot resource hints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-seo.cjs')
          s=p.read_text()

          old="""const ORIGIN = 'https://www.concursotrilhaaprova.online';
const CDN = 'https://margareth-5-estrategias.floot.app';
const SUPPORT_EMAIL = 'suporte@concursotrilhaaprova.online';"""
          new="""const ORIGIN = 'https://www.concursotrilhaaprova.online';
const SUPPORT_EMAIL = 'suporte@concursotrilhaaprova.online';"""
          assert s.count(old)==1, 'Legacy CDN declaration not found exactly once'
          s=s.replace(old,new)

          old="""    `<link rel=\"preconnect\" href=\"${CDN}\" crossorigin>` +
    `<link rel=\"dns-prefetch\" href=\"${CDN}\">` +
"""
          assert s.count(old)==1, 'Legacy CDN preconnect block not found exactly once'
          s=s.replace(old,'')

          old="""    '<meta property=\"og:image:width\" content=\"1200\">' +
    '<meta property=\"og:image:height\" content=\"1200\">' +
"""
          assert s.count(old)==1, 'Hard-coded OG dimensions block not found exactly once'
          s=s.replace(old,'')

          old="""  const isAutores = p.slug.startsWith('autores');

  const fit = isAutores
    ? 'Esta apostila revisa autores para Professor Adjunto I e Professor Adjunto II — Educação Especial, com foco na banca IBAM e na edição Santos 2026. Não substitui o estudo de todas as disciplinas do edital.'
    : 'Esta apostila trabalha redação para candidatos de ensino fundamental completo. O gênero textual e os critérios cobrados variam conforme o edital; não é uma apostila específica de todas as disciplinas de um cargo.';
"""
          new="""  const isAutores = p.slug.startsWith('autores');
  const isRedacao = p.slug.startsWith('redacao');

  const fit = isAutores
    ? 'Esta apostila revisa autores para Professor Adjunto I e Professor Adjunto II — Educação Especial, com foco na banca IBAM e na edição Santos 2026. Não substitui o estudo de todas as disciplinas do edital.'
    : isRedacao
      ? 'Esta apostila trabalha redação para candidatos de ensino fundamental completo. O gênero textual e os critérios cobrados variam conforme o edital; não é uma apostila específica de todas as disciplinas de um cargo.'
      : `Esta apostila foi desenvolvida especificamente para ${p.audience}, com conteúdo direcionado a ${p.contest} e à banca ${p.examBoard}. Compare o sumário com o conteúdo programático oficial do cargo antes da compra.`;
"""
          assert s.count(old)==1, 'Legacy product-fit decision block not found exactly once'
          s=s.replace(old,new)

          old="{ q: `Quanto custa a ${p.shortName}?`, a: `${brl(p.priceCents)} em pagamento único, sem assinatura. O valor inclui o PDF completo, o resumo em áudio e os ${p.assets.chapters.length} capítulos do audiobook.` },"
          new="{ q: 'Quanto custa esta apostila?', a: `${brl(p.priceCents)} em pagamento único, sem assinatura. O valor inclui o PDF completo, o resumo em áudio e os ${p.assets.chapters.length} capítulos do audiobook.` },"
          assert s.count(old)==1, 'Price FAQ line not found exactly once'
          s=s.replace(old,new)

          p.write_text(s)
          print('Product SEO generator polished.')
          PY

      - name: Build and audit every public page
        run: |
          set -euo pipefail
          npm ci
          npm run build
          if grep -RIl 'margareth-5-estrategias.floot.app' scripts public products | grep -q .; then
            echo 'Legacy Floot reference remains in production sources.' >&2
            grep -RIl 'margareth-5-estrategias.floot.app' scripts public products >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          page=Path('public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html').read_text()
          assert 'Esta apostila trabalha redação para candidatos de ensino fundamental completo' not in page
          assert 'Esta apostila foi desenvolvida especificamente para Secretário de Unidade Escolar' in page
          assert 'Quanto custa esta apostila?' in page
          assert 'margareth-5-estrategias.floot.app' not in page
          title=re.search(r'<title>(.*?)</title>',page,re.S).group(1)
          assert len(title) <= 60, (len(title),title)
          print('Secretary product page manual gates OK:', title)
          PY

      - name: Commit polished generator and regenerated public output
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git rm -f .github/workflows/polish-product-pages.yml
          git add scripts/build-seo.cjs public
          git diff --cached --check
          git commit -m 'fix: correct product-fit FAQs and remove legacy Floot hints'
          git push origin HEAD:ops/secretario-unidade-escolar-2026
