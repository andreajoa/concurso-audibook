name: Finalize Secretario current summary and storefront

on:
  push:
    branches:
      - ops/secretario-unidade-escolar-2026
    paths:
      - .github/workflows/polish-product-pages.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install R2 client
        run: python3 -m pip install --disable-pip-version-check --quiet boto3

      - name: Create short-lived private staging upload slot
        run: |
          set -euo pipefail
          mkdir -p /tmp/secretario-upload-slot
          python3 - <<'PY'
          import json, os
          import boto3
          from botocore.config import Config

          account='dbad4dc0550693a69d5956df7344e001'
          bucket='apostila'
          endpoint=f'https://{account}.r2.cloudflarestorage.com'
          run=os.environ['GITHUB_RUN_ID']
          attempt=os.environ.get('GITHUB_RUN_ATTEMPT','1')
          key=f'__staging/secretario-summary/{run}-{attempt}.mp3'
          s3=boto3.client(
              's3', endpoint_url=endpoint, region_name='auto',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4'),
          )
          url=s3.generate_presigned_url(
              'put_object',
              Params={'Bucket':bucket,'Key':key,'ContentType':'audio/mpeg'},
              ExpiresIn=900,
          )
          with open('/tmp/secretario-upload-slot/slot.json','w',encoding='utf-8') as f:
              json.dump({'url':url,'key':key,'contentType':'audio/mpeg'},f)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'SUMMARY_STAGE_KEY={key}\n')
          print('Secure staging slot created; URL is carried only by an authenticated workflow artifact.')
          PY

      - name: Publish upload slot artifact
        uses: actions/upload-artifact@v4
        with:
          name: secretario-summary-upload-slot
          path: /tmp/secretario-upload-slot/slot.json
          retention-days: 1
          if-no-files-found: error

      - name: Wait for current summary, validate bytes, and replace private R2 summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, time
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          account='dbad4dc0550693a69d5956df7344e001'
          bucket='apostila'
          endpoint=f'https://{account}.r2.cloudflarestorage.com'
          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          stage=os.environ['SUMMARY_STAGE_KEY']
          final=f'{slug}/audio/resumo.mp3'
          manifest_key=f'{slug}/audio/manifest.json'
          expected_sha='4868f75c672421690ad083b38b666f5036adafbcfb89fead3053a7497639440d'
          original_sha='c2d6c7a297ed2da48bcc0c1b77c2bb84d54e8c323afbd27b365da4065d9ba474'
          expected_duration=1018.462041
          source_duration=1018.427211
          s3=boto3.client(
              's3', endpoint_url=endpoint, region_name='auto',
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              config=Config(signature_version='s3v4', retries={'max_attempts':5,'mode':'standard'}),
          )

          found=False
          for _ in range(180):
              try:
                  s3.head_object(Bucket=bucket,Key=stage)
                  found=True
                  break
              except ClientError as exc:
                  code=exc.response.get('ResponseMetadata',{}).get('HTTPStatusCode')
                  if code not in (403,404):
                      raise
              time.sleep(3)
          if not found:
              raise RuntimeError('Timed out waiting for the approved current summary upload')

          target=Path('/tmp/current-secretario-summary.mp3')
          s3.download_file(bucket,stage,str(target))
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          if digest != expected_sha:
              raise RuntimeError(f'Current summary checksum mismatch: {digest}')
          if target.stat().st_size != 12221995:
              raise RuntimeError(f'Unexpected current summary size: {target.stat().st_size}')

          probe=subprocess.run([
              'ffprobe','-v','error','-show_entries','format=format_name,duration',
              '-of','json',str(target)
          ],check=True,capture_output=True,text=True)
          info=json.loads(probe.stdout)['format']
          duration=float(info['duration'])
          if 'mp3' not in info['format_name'].lower() or abs(duration-expected_duration) > 1.0:
              raise RuntimeError(f'Invalid current summary media: {info}')
          subprocess.run(['ffmpeg','-v','error','-xerror','-i',str(target),'-f','null','-'],check=True)

          s3.upload_file(
              str(target),bucket,final,
              ExtraArgs={
                  'ContentType':'audio/mpeg',
                  'CacheControl':'private, no-store',
                  'Metadata':{
                      'sha256':expected_sha,
                      'original-sha256':original_sha,
                      'source':'A_logica_do_concurso_de_Santos_2026.m4a',
                  },
              },
          )
          body=s3.get_object(Bucket=bucket,Key=final)['Body']
          h=hashlib.sha256()
          try:
              for chunk in body.iter_chunks(chunk_size=1024*1024):
                  h.update(chunk)
          finally:
              body.close()
          if h.hexdigest()!=expected_sha:
              raise RuntimeError('Final R2 summary byte verification failed')

          try:
              manifest=json.loads(s3.get_object(Bucket=bucket,Key=manifest_key)['Body'].read())
          except Exception:
              manifest={'slug':slug,'language':'pt-BR','voice':'pt_BR-cadu-medium','tracks':[]}
          tracks=[t for t in manifest.get('tracks',[]) if t.get('id')!='summary']
          tracks.insert(0,{
              'id':'summary','key':final,'durationSeconds':round(duration,2),
              'sha256':expected_sha,'sourceSha256':original_sha,
              'sourceDurationSeconds':round(source_duration,2),
          })
          manifest['slug']=slug
          manifest['language']='pt-BR'
          manifest['voice']='pt_BR-cadu-medium'
          manifest['tracks']=tracks
          s3.put_object(
              Bucket=bucket,Key=manifest_key,
              Body=json.dumps(manifest,ensure_ascii=False,indent=2).encode('utf-8'),
              ContentType='application/json',CacheControl='private, no-store',
          )
          s3.delete_object(Bucket=bucket,Key=stage)
          print(f'CURRENT SUMMARY VERIFIED AND INSTALLED: {duration:.2f}s, sha256={expected_sha}')
          PY

      - name: Correct catalog, FAQ and product metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          catalog_path=Path('products/catalog.json')
          catalog=json.loads(catalog_path.read_text(encoding='utf-8'))
          p=catalog[slug]
          summary=p['assets']['summary']
          summary['title']='Resumo da Apostila — A lógica do concurso de Santos 2026'
          summary['subtitle']='Resumo em áudio para compreender a lógica da prova e orientar a revisão'
          summary['downloadName']='Resumo_A_logica_do_concurso_de_Santos_2026.mp3'
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          path=Path('scripts/build-seo.cjs')
          s=path.read_text(encoding='utf-8')
          old="const ORIGIN = 'https://www.concursotrilhaaprova.online';\nconst CDN = 'https://margareth-5-estrategias.floot.app';\nconst SUPPORT_EMAIL = 'suporte@concursotrilhaaprova.online';"
          new="const ORIGIN = 'https://www.concursotrilhaaprova.online';\nconst SUPPORT_EMAIL = 'suporte@concursotrilhaaprova.online';"
          if old in s:
              s=s.replace(old,new)
          old="    `<link rel=\"preconnect\" href=\"${CDN}\" crossorigin>` +\n    `<link rel=\"dns-prefetch\" href=\"${CDN}\">` +\n"
          s=s.replace(old,'')
          old="    '<meta property=\"og:image:width\" content=\"1200\">' +\n    '<meta property=\"og:image:height\" content=\"1200\">' +\n"
          s=s.replace(old,'')
          old="  const isAutores = p.slug.startsWith('autores');\n\n  const fit = isAutores\n    ? 'Esta apostila revisa autores para Professor Adjunto I e Professor Adjunto II — Educação Especial, com foco na banca IBAM e na edição Santos 2026. Não substitui o estudo de todas as disciplinas do edital.'\n    : 'Esta apostila trabalha redação para candidatos de ensino fundamental completo. O gênero textual e os critérios cobrados variam conforme o edital; não é uma apostila específica de todas as disciplinas de um cargo.';\n"
          new="  const isAutores = p.slug.startsWith('autores');\n  const isRedacao = p.slug.startsWith('redacao');\n\n  const fit = isAutores\n    ? 'Esta apostila revisa autores para Professor Adjunto I e Professor Adjunto II — Educação Especial, com foco na banca IBAM e na edição Santos 2026. Não substitui o estudo de todas as disciplinas do edital.'\n    : isRedacao\n      ? 'Esta apostila trabalha redação para candidatos de ensino fundamental completo. O gênero textual e os critérios cobrados variam conforme o edital; não é uma apostila específica de todas as disciplinas de um cargo.'\n      : `Esta apostila foi desenvolvida especificamente para ${p.audience}, com conteúdo direcionado a ${p.contest} e à banca ${p.examBoard}. Compare o sumário com o conteúdo programático oficial do cargo antes da compra.`;\n"
          if old in s:
              s=s.replace(old,new)
          old="{ q: `Quanto custa a ${p.shortName}?`, a: `${brl(p.priceCents)} em pagamento único, sem assinatura. O valor inclui o PDF completo, o resumo em áudio e os ${p.assets.chapters.length} capítulos do audiobook.` },"
          new="{ q: 'Quanto custa esta apostila?', a: `${brl(p.priceCents)} em pagamento único, sem assinatura. O valor inclui o PDF completo, o resumo em áudio e os ${p.assets.chapters.length} capítulos do audiobook.` },"
          s=s.replace(old,new)
          path.write_text(s,encoding='utf-8')
          print('Catalog and product generator corrected.')
          PY

      - name: Build and run release gates
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run verify
          npm run verify:seo
          npm run verify:scrollcraft
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          page=Path('public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html').read_text(encoding='utf-8')
          assert 'Esta apostila trabalha redação para candidatos de ensino fundamental completo' not in page
          assert 'Esta apostila foi desenvolvida especificamente para Secretário de Unidade Escolar' in page
          assert 'Quanto custa esta apostila?' in page
          assert 'A lógica do concurso de Santos 2026' in page
          assert 'margareth-5-estrategias.floot.app' not in page
          assert 'data:image' not in page.lower()
          assert ';base64,' not in page.lower()
          cover=Path('public/assets/apostila-secretario-unidade-escolar-3d.webp')
          data=cover.read_bytes()
          assert len(data)>50000
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert b'data:image' not in data.lower() and b'base64,' not in data.lower()
          ident=subprocess.run(['identify','-format','%m %w %h',str(cover)],check=True,capture_output=True,text=True).stdout
          assert ident=='WEBP 1086 1448', ident
          title=re.search(r'<title>(.*?)</title>',page,re.S).group(1)
          assert len(title)<=60,(len(title),title)
          print('PRODUCT PAGE + REAL BINARY COVER GATES OK:',title,ident)
          PY

      - name: Verify all private paid media before release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          import boto3
          from botocore.config import Config

          account='dbad4dc0550693a69d5956df7344e001'
          bucket='apostila'
          endpoint=f'https://{account}.r2.cloudflarestorage.com'
          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          expected_summary='4868f75c672421690ad083b38b666f5036adafbcfb89fead3053a7497639440d'
          s3=boto3.client('s3',endpoint_url=endpoint,region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4'))
          catalog=json.load(open('products/catalog.json',encoding='utf-8'))[slug]
          keys=[catalog['assets']['pdfKey'],catalog['assets']['coverKey'],catalog['assets']['summary']['key']]+[c['key'] for c in catalog['assets']['chapters']]
          assert len(keys)==11 and len(set(keys))==11
          for key in keys:
              meta=s3.head_object(Bucket=bucket,Key=key)
              assert meta['ContentLength']>1000,(key,meta['ContentLength'])
              print('PRIVATE MEDIA OK',key,meta['ContentLength'])
          body=s3.get_object(Bucket=bucket,Key=catalog['assets']['summary']['key'])['Body']
          h=hashlib.sha256()
          try:
              for chunk in body.iter_chunks(chunk_size=1024*1024): h.update(chunk)
          finally:
              body.close()
          assert h.hexdigest()==expected_summary,h.hexdigest()
          print('CURRENT SUMMARY BYTE HASH VERIFIED IN PRIVATE R2')
          PY

      - name: Commit release-ready storefront and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git rm -f .github/workflows/polish-product-pages.yml
          git add products/catalog.json scripts/build-seo.cjs public
          git diff --cached --check
          git commit -m 'release: finalize Secretario with current summary and storefront polish'
          git push origin HEAD:ops/secretario-unidade-escolar-2026
