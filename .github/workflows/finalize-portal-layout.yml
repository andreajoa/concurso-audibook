name: Rebuild public pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-portal-layout.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate public SEO and GEO pages
        run: node scripts/build-seo.cjs
      - name: Commit regenerated public pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate public pages with Trilha Aprova brand'
          git push origin HEAD:main
