name: Rebuild public pages
# brand rebuild v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-portal-layout.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate public SEO and GEO pages
        run: node scripts/build-seo.cjs
      - name: Verify personal-name references are gone
        run: |
          set -euo pipefail
          n1="$(printf '\\115\\141\\162\\147\\141\\162\\145\\164\\150')"
          n2="$(printf '\\115\\141\\162\\147\\141\\162\\145\\164\\145')"
          n3="$(printf '\\101\\154\\155\\145\\151\\144\\141')"
          n4="$(printf '\\156\\145\\165\\162\\157\\155\\141\\162\\147\\141\\162\\145\\164\\150')"
          matches="$(grep -RniE --exclude-dir=.git --binary-files=without-match "$n1|$n2|$n3|$n4" . || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            exit 1
          fi
          echo "No personal-name references found."
      - name: Commit regenerated public pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate public pages with Trilha Aprova brand'
          git push origin HEAD:main
