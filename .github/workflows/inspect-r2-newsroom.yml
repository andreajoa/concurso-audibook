name: Inspect Cloudflare R2 newsroom assets
on:
  push:
    branches: [portal-news-layout-20260914]
    paths:
      - '.github/workflows/inspect-r2-newsroom.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: List image/archive objects in Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: dbad4dc0550693a69d5956df7344e001
          R2_BUCKET: apostila
        run: |
          node --input-type=module <<'NODE'
          import { S3Client, ListObjectsV2Command } from '@aws-sdk/client-s3';
          const client = new S3Client({region:'auto',endpoint:`https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,credentials:{accessKeyId:process.env.R2_ACCESS_KEY_ID,secretAccessKey:process.env.R2_SECRET_ACCESS_KEY}});
          let token; const all=[];
          do {
            const out=await client.send(new ListObjectsV2Command({Bucket:process.env.R2_BUCKET,ContinuationToken:token,MaxKeys:1000}));
            for(const o of out.Contents||[]){const k=o.Key||''; if(/\.(?:webp|png|jpe?g|gif|zip)$/i.test(k)) all.push({key:k,size:o.Size,lastModified:o.LastModified});}
            token=out.IsTruncated?out.NextContinuationToken:undefined;
          } while(token);
          console.log('R2_MEDIA_BEGIN');
          console.log(JSON.stringify(all,null,2));
          console.log('R2_MEDIA_END');
          NODE
