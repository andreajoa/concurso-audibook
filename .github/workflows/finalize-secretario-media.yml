name: Finalize Secretario storefront from verified R2 media

on:
  push:
    branches:
      - ops/secretario-unidade-escolar-2026
    paths:
      - .github/workflows/finalize-secretario-media.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-secretario-media
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app and image validation dependencies
        run: |
          set -euo pipefail
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick file

      - name: Restore and validate the real binary cover from private Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secretario-cover"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { signObject } = require('./lib/r2');
          (async () => {
            const key = 'secretario-de-unidade-escolar-ibam-santos-2026/images/secretario-de-unidade-escolar-ibam-santos-2026-capa.png';
            const url = await signObject(key, { expiresIn: 300 });
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Private R2 cover download failed: ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (hash !== 'dc77a8b07022249ced5734cc7dc2f5f93a91d50b0ea2518bbe9f227fe43b75b7') {
              throw new Error(`Unexpected cover SHA-256: ${hash}`);
            }
            const out = `${process.env.RUNNER_TEMP}/secretario-cover/source.png`;
            fs.writeFileSync(out, bytes);
            console.log(`Private R2 cover restored and SHA-256 verified (${bytes.length} bytes).`);
          })().catch(err => { console.error(err.message); process.exit(1); });
          NODE
          file "$RUNNER_TEMP/secretario-cover/source.png"
          identify -regard-warnings "$RUNNER_TEMP/secretario-cover/source.png" | grep -q 'PNG 1086x1448'

      - name: Build and validate the public binary WebP cover
        run: |
          set -euo pipefail
          OUT="public/assets/apostila-secretario-unidade-escolar-3d.webp"
          convert "$RUNNER_TEMP/secretario-cover/source.png" -quality 84 -define webp:method=6 "$OUT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/assets/apostila-secretario-unidade-escolar-3d.webp')
          b=p.read_bytes()
          assert len(b)>50000, 'WebP unexpectedly small'
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', 'Not a real WebP binary'
          assert b'data:image' not in b and b'base64,' not in b, 'Forbidden inline representation'
          print(f'BINARY WEBP OK: {p.stat().st_size} bytes; RIFF/WEBP signature valid')
          PY
          identify -regard-warnings "$OUT" | grep -q 'WEBP 1086x1448'
          file "$OUT" | grep -q 'Web/P image'

      - name: Activate the verified product and keep its commercial name while shortening only the SERP title
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          catalog_path=Path('products/catalog.json')
          draft_path=Path('products/secretario-product.draft.json')
          catalog=json.loads(catalog_path.read_text())
          staged=json.loads(draft_path.read_text())[slug]
          existing=catalog.get(slug)
          if existing is not None and existing != staged:
              raise SystemExit('Catalog already contains a different Secretario product; refusing overwrite')
          catalog[slug]=staged
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')

          build_path=Path('scripts/build-seo.cjs')
          text=build_path.read_text()
          old="metaTitle: p.shortName + ' com audiobook | Trilha Aprova',"
          new="metaTitle: p.seoTitle || (p.shortName + ' com audiobook | Trilha Aprova'),"
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one product metaTitle expression, found {count}')
          build_path.write_text(text.replace(old,new))
          print(f'Activated {slug}; commercial title preserved; dedicated SEO title enabled.')
          PY

      - name: Verify private delivery, checkout architecture, SEO, GEO and storefront build
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          npm run verify:remote
          npm run build
          PAGE="public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html"
          test -s "$PAGE"
          grep -q 'Secretário de Unidade Escolar' "$PAGE"
          grep -q '/assets/apostila-secretario-unidade-escolar-3d.webp' "$PAGE"
          grep -q 'R$ 24,99' "$PAGE"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html')
          h=p.read_text()
          title=re.search(r'<title>(.*?)</title>',h,re.S).group(1)
          assert len(title) <= 60, (len(title), title)
          assert title == 'Secretário Escolar Santos 2026 + audiobook | Trilha Aprova', title
          print(f'SERP title OK: {len(title)} chars — {title}')
          PY
          if grep -RIlE 'data:image/[^;]+;base64|base64,' public products scripts --exclude='*.map' | grep -q .; then
            echo 'Forbidden inline/base64 image representation found.' >&2
            exit 1
          fi

      - name: Commit only production-ready storefront sources and normal binary assets
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-secretario-media.yml \
            .github/workflows/validate-secretario-draft.yml \
            .github/workflows/inspect-secretario-r2.yml \
            products/secretario-product.draft.json \
            products/secretario-media-sources.json \
            scripts/publish_secretario_media.py
          git add products/catalog.json scripts/build-seo.cjs public
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(secretario.*\.(pdf|mp3|m4a)|.*base64.*)$'; then
            echo 'Paid media or base64 staging must never enter Git history.' >&2
            exit 1
          fi
          git status --short
          git commit -m 'feat: publish Secretario de Unidade Escolar with private audiobook delivery'
          git push origin HEAD:ops/secretario-unidade-escolar-2026

      - name: Remove ephemeral cover bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/secretario-cover"
