name: Finalize Secretario media and storefront

on:
  push:
    branches:
      - ops/secretario-unidade-escolar-2026
    paths:
      - .github/workflows/finalize-secretario-media.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-secretario-media
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PDF_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-15fc-820e-bd96-cf19fa3cb613/raw?se=2026-09-16T19%3A30%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=7c1d2c6a-7a1a-5a89-b9b7-72d6f5c1fded&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T12%3A53%3A13Z&ske=2026-09-17T12%3A53%3A13Z&sks=b&skv=2026-02-06&sig=mp3eTnv%2B2J6mjRV3k1T3DkVuwheuc2CvGUflmr4M6sU%3D'
      SUMMARY_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1970-820e-8919-d22a4e4d2699/raw?se=2026-09-16T19%3A30%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=0fa6a821-0442-5b57-a78d-3c189d4dd909&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T17%3A14%3A27Z&ske=2026-09-17T17%3A14%3A27Z&sks=b&skv=2026-02-06&sig=OxKBxvxF92QGxTKAR/JVr3bepGBslyKqIDCJSnrLUGg%3D'
      COVER_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2f10-820e-ab8a-9d4dd39a4c0e/raw?se=2026-09-16T19%3A31%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=2ad929f7-8807-52c4-8a51-642c6c519e19&skoid=fbc53507-c13f-4907-b4dd-0e03c91f5ad8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T12%3A53%3A13Z&ske=2026-09-17T12%3A53%3A13Z&sks=b&skv=2026-02-06&sig=71/OznSx10HXSpXHCCYoV5ylPqIlrwHOnF3EPnrFils%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install media and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg imagemagick file
          python -m pip install --disable-pip-version-check boto3 requests pymupdf piper-tts==1.4.2

      - name: Download approved private sources into ephemeral runner storage
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/secretario-private-sources"
          mkdir -p "$SRC"
          chmod 700 "$SRC"
          curl --fail --location --retry 3 --silent --show-error "$PDF_URL" -o "$SRC/secretario-de-unidade-escolar-ibam-santos-2026.pdf"
          curl --fail --location --retry 3 --silent --show-error "$SUMMARY_URL" -o "$SRC/secretario-resumo.m4a"
          curl --fail --location --retry 3 --silent --show-error "$COVER_URL" -o "$SRC/secretario-de-unidade-escolar-capa-3d.png"
          unset PDF_URL SUMMARY_URL COVER_URL
          echo 'Private source transfer completed; URLs are short-lived and sources remain in runner temp storage.'

      - name: Validate exact PDF, summary and real binary PNG before publication
        run: |
          python scripts/publish_secretario_media.py --source-dir "$RUNNER_TEMP/secretario-private-sources" --validate-only
          file "$RUNNER_TEMP/secretario-private-sources/secretario-de-unidade-escolar-capa-3d.png"
          identify -regard-warnings "$RUNNER_TEMP/secretario-private-sources/secretario-de-unidade-escolar-capa-3d.png"

      - name: Build and validate public binary WebP cover
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/secretario-private-sources/secretario-de-unidade-escolar-capa-3d.png"
          OUT="public/assets/apostila-secretario-unidade-escolar-3d.webp"
          convert "$SRC" -quality 84 -define webp:method=6 "$OUT"
          python - <<'PY'
          import struct
          from pathlib import Path
          p=Path('public/assets/apostila-secretario-unidade-escolar-3d.webp')
          b=p.read_bytes()
          assert len(b)>50000, 'WebP unexpectedly small'
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP', 'Not a real WebP binary'
          print(f'BINARY WEBP OK: {p.stat().st_size} bytes; RIFF/WEBP signature valid')
          PY
          identify -regard-warnings "$OUT"
          file "$OUT"

      - name: Publish PDF, supplied summary and 8 generated audiobook chapters to private R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -u scripts/publish_secretario_media.py --source-dir "$RUNNER_TEMP/secretario-private-sources"

      - name: Activate product only after R2 publication succeeds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          catalog_path=Path('products/catalog.json')
          catalog=json.loads(catalog_path.read_text())
          staged=json.loads(Path('products/secretario-product.draft.json').read_text())[slug]
          if slug in catalog:
              raise SystemExit('Refusing duplicate catalog activation')
          catalog[slug]=staged
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          print(f'Activated {slug} after successful private-media publication.')
          PY

      - name: Install app dependencies and run full project verification
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          npm ci
          npm run verify:remote
          npm run build
          test -s public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html
          grep -q 'Secretário de Unidade Escolar' public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html
          grep -q '/assets/apostila-secretario-unidade-escolar-3d.webp' public/apostilas/secretario-de-unidade-escolar-ibam-santos-2026.html
          if grep -RIlE 'data:image/[^;]+;base64|base64,' public products scripts --exclude='*.map' | grep -q .; then
            echo 'Forbidden inline/base64 image representation found.' >&2
            exit 1
          fi

      - name: Commit normal binary cover and activated storefront sources
        run: |
          set -euo pipefail
          git config user.name 'Trilha Aprova Release Bot'
          git config user.email '100246160+andreajoa@users.noreply.github.com'
          git rm -f .github/workflows/finalize-secretario-media.yml \
                    .github/workflows/validate-secretario-draft.yml \
                    .github/workflows/inspect-secretario-r2.yml \
                    products/secretario-product.draft.json
          git add products/catalog.json products/secretario-media-sources.json scripts/publish_secretario_media.py public
          git diff --cached --check
          git status --short
          git commit -m 'feat: publish Secretario de Unidade Escolar course with audiobook'
          git push origin HEAD:ops/secretario-unidade-escolar-2026

      - name: Remove private runner sources
        if: always()
        run: rm -rf "$RUNNER_TEMP/secretario-private-sources"
