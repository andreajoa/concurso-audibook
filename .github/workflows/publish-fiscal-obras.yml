name: Publish Fiscal de Obras Matão private R2 media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-fiscal-obras.yml']
permissions:
  contents: write
concurrency:
  group: publish-fiscal-obras-matao-private
  cancel-in-progress: false
jobs:
  private-release:
    if: github.repository == 'andreajoa/concurso-audibook'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R2_ACCOUNT_ID: dbad4dc0550693a69d5956df7344e001
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      STAGING: /tmp/fiscal-obras-private-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media validation libraries
        run: |
          python -m pip install --disable-pip-version-check pypdf boto3 requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download assets from owner-controlled draft release
        run: |
          mkdir -p "$STAGING"
          gh api -H 'Accept: application/octet-stream' repos/andreajoa/concurso-audibook/releases/assets/689709050 > "$STAGING/fiscal-obras-media.zip"
          file "$STAGING/fiscal-obras-media.zip"
          test "$(stat -c%s "$STAGING/fiscal-obras-media.zip")" -eq 126840052
          unzip -q "$STAGING/fiscal-obras-media.zip" -d "$STAGING"
          test "$(find "$STAGING" -maxdepth 1 -type f | wc -l)" -eq 12
      - name: Upload and verify all media privately
        run: python -u scripts/upload_fiscal_obras_r2.py "$STAGING"
      - name: Assert no paid files in public Git tree
        run: |
          test ! -e public/assets/apostila.pdf
          test ! -e public/assets/resumo.mp3
