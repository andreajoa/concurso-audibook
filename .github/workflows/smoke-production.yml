name: Production commerce smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-production.yml'
      - 'public/**'
      - 'api/checkout.js'
      - 'api/order-status.js'
      - 'api/access-page.js'
      - 'lib/checkout-hosted.js'
      - 'lib/stripe.js'
      - 'lib/payment-public-key.js'
      - 'products/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deploy and test commerce
        shell: bash
        run: |
          node <<'NODE'
          const base='https://concurso-audibook.vercel.app';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const fail=m=>{console.error('FAIL',m);process.exit(1)};
          const ok=m=>console.log('OK  ',m);

          async function waitForHome(){
            for(let i=0;i<24;i++){
              try{
                const r=await fetch(base+'/',{cache:'no-store'});
                const html=await r.text();
                if(r.ok&&html.includes('Trilha Aprova')&&html.includes('R$ 49,99')&&html.includes('R$ 24,99')&&html.includes('bf874874')) return html;
              }catch{}
              console.log(`waiting for Vercel production deploy (${i+1}/24)`);
              await sleep(5000);
            }
            fail('new Trilha Aprova storefront did not reach production in time');
          }

          const html=await waitForHome();
          if(!/<del[^>]*>R\$ 49,99<\/del>/.test(html)) fail('R$ 49,99 is not rendered as crossed-out price on storefront');
          if(/>[^<]*Stripe[^<]*</i.test(html)) fail('payment provider name is visible on storefront');
          ok('storefront live with restored 3D cover and provider-neutral payment copy');

          const logo=await fetch(base+'/assets/trilha-aprova-logo.webp',{cache:'no-store'});
          if(!logo.ok||!(logo.headers.get('content-type')||'').includes('image')) fail(`brand logo asset invalid: HTTP ${logo.status}`);
          const cover=await fetch(base+'/assets/apostila-santos-ibam-3d.webp?v=bf874874',{cache:'no-store'});
          if(!cover.ok||!(cover.headers.get('content-type')||'').includes('image')) fail(`3D cover asset invalid: HTTP ${cover.status}`);
          const coverBytes=(await cover.arrayBuffer()).byteLength;
          if(coverBytes<30000) fail(`3D cover asset suspiciously small: ${coverBytes} bytes`);
          ok(`brand and restored 3D cover assets valid (${coverBytes} bytes)`);

          const manifest=await fetch(base+'/materials.json',{redirect:'manual'});
          if(manifest.status>=200&&manifest.status<400) fail(`public paid manifest still reachable: HTTP ${manifest.status}`);
          ok(`public paid manifest blocked/absent: HTTP ${manifest.status}`);

          const locked=await fetch(base+'/acesso',{redirect:'manual'});
          if(![301,302,303,307,308].includes(locked.status)) fail(`/acesso without purchase did not redirect: HTTP ${locked.status}`);
          if(!(locked.headers.get('location')||'').includes('recuperar')) fail('buyer area redirect is unexpected');
          ok('buyer area locked without a valid purchase session');

          let config={};
          for(let i=0;i<18;i++){
            const response=await fetch(base+'/api/checkout',{cache:'no-store'});
            config=await response.json().catch(()=>({}));
            if(response.ok&&config.readiness) break;
            await sleep(4000);
          }
          if(!config.readiness) fail('production checkout readiness endpoint is not current');
          console.log('READINESS',JSON.stringify({embedded:Boolean(config.embedded),paymentSecret:Boolean(config.readiness.paymentSecret),webhook:Boolean(config.readiness.webhook),email:Boolean(config.readiness.email),delivery:Boolean(config.readiness.delivery)}));
          if(!config.readiness.paymentSecret) fail('payment secret is not configured in production');
          if(!config.readiness.delivery) fail('private delivery credentials are not configured in production');
          if(!config.readiness.email) fail('transactional email provider is not configured in production');
          if(!config.embedded||!String(config.publishableKey||'').startsWith('pk_')) fail('embedded payment is not available in production');
          if(!config.readiness.webhook) console.warn('WARN webhook signing secret absent; paid-order confirmation fallback remains active');
          ok('embedded payment configuration is available');

          const qa=`qa-${Date.now()}@example.com`;
          const checkout=await fetch(base+'/api/checkout',{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({slug:'autores-ibam-2026',name:'Teste QA Trilha Aprova',email:qa,whatsapp:'11999999999',marketingConsent:false,embedded:true,analytics:{visitorId:'qa-smoke-visitor',sessionId:`qa-smoke-${Date.now()}`,source:'qa',medium:'automation',campaign:'production-smoke'}})
          });
          const text=await checkout.text();let data={};try{data=JSON.parse(text)}catch{}
          if(!checkout.ok) fail(`checkout HTTP ${checkout.status}: ${text.slice(0,500)}`);
          if(!String(data.sessionId||'').startsWith('cs_')) fail(`checkout missing payment session: ${text.slice(0,500)}`);
          if(data.mode!=='embedded'||!data.clientSecret||!String(data.clientSecret).includes('_secret_')) fail('embedded checkout session is invalid');
          ok('production embedded checkout session created');
          console.log('SMOKE PASS');
          NODE
