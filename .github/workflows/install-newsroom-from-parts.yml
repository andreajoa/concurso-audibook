name: Install validated newsroom binaries
on:
  push:
    branches: [portal-news-layout-20260914]
    paths:
      - 'ops/newsroom-b64/READY'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reassemble uploaded image archive
        run: |
          set -euo pipefail
          cat ops/newsroom-b64/*.part | base64 -d > /tmp/newsroom.zip
          echo '432b7dadf474f9bd12988b699b5975b987cef9ec21c7eb5c069e971d8ed4c542  /tmp/newsroom.zip' | sha256sum -c -
          rm -rf /tmp/newsroom && mkdir -p /tmp/newsroom
          unzip -q /tmp/newsroom.zip -d /tmp/newsroom
          test "$(find /tmp/newsroom/newsroom_ready_768 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 16
      - name: Validate real WebP binaries and dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          root=Path('/tmp/newsroom/newsroom_ready_768')
          expected={
            'apostilas-audio.webp':(768,432),'cidade-catanduva.webp':(768,432),'cidade-guarulhos.webp':(768,432),'cidade-santos.webp':(768,432),
            'concurso-generico.webp':(768,432),'concursos-nacional.webp':(768,432),'cta-futuro.webp':(768,329),'ferramentas-dashboard.webp':(768,432),
            'guias-estudo.webp':(768,432),'home-sao-paulo.webp':(768,432),'noticia-edital.webp':(768,432),'noticia-planejamento.webp':(768,432),
            'noticia-provas.webp':(768,432),'noticia-salarios.webp':(768,432),'noticias-editorial.webp':(768,432),'sobre-trilha.webp':(768,432)
          }
          def size(path):
            data=path.read_bytes()
            assert len(data)>30 and data[:4]==b'RIFF' and data[8:12]==b'WEBP', path
            off=12
            while off+8<=len(data):
              kind=data[off:off+4]; n=struct.unpack_from('<I',data,off+4)[0]; p=data[off+8:off+8+n]
              if kind==b'VP8X': return 1+int.from_bytes(p[4:7],'little'),1+int.from_bytes(p[7:10],'little')
              if kind==b'VP8 ':
                i=p.find(b'\x9d\x01\x2a'); assert i>=0
                return int.from_bytes(p[i+3:i+5],'little')&0x3fff,int.from_bytes(p[i+5:i+7],'little')&0x3fff
              if kind==b'VP8L':
                bits=int.from_bytes(p[1:5],'little'); return (bits&0x3fff)+1,((bits>>14)&0x3fff)+1
              off += 8+n+(n&1)
            raise AssertionError(f'no WebP size chunk: {path}')
          files={p.name:p for p in root.glob('*.webp')}
          assert set(files)==set(expected),(set(expected)-set(files),set(files)-set(expected))
          for name,p in sorted(files.items()):
            got=size(p); assert got==expected[name],(name,got,expected[name])
            print(name,got,p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Install binary images and normalize Cloudflare-backed covers
        run: |
          set -euo pipefail
          mkdir -p public/assets/newsroom
          cp /tmp/newsroom/newsroom_ready_768/*.webp public/assets/newsroom/
          node scripts/cloudflare-normalize.mjs
      - name: Verify build, SEO and responsive layout
        run: |
          set -euo pipefail
          npm ci
          npm run build
          ! grep -R --exclude-dir=.git --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' -n 'margareth-5-estrategias\.floot\.app' .
          ! grep -R --exclude-dir=.git --exclude='*.webp' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' -n 'data:image' public scripts
          test "$(find public/assets/newsroom -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 16
      - name: Remove one-shot transport and obsolete workflows
        run: |
          set -euo pipefail
          rm -rf ops/newsroom-b64
          rm -f .github/workflows/install-newsroom-from-parts.yml
          rm -f .github/workflows/inspect-r2-newsroom.yml
          rm -f .github/workflows/install-portal-images.yml
          rm -f .github/workflows/finalize-portal-layout.yml
          rm -f scripts/cloudflare-normalize.mjs
      - name: Commit finished portal branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finish unified concurso news portal with validated binary imagery'
          git push origin HEAD:portal-news-layout-20260914
