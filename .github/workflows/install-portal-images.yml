name: Install portal images
on:
  push:
    paths:
      - '.github/workflows/install-portal-images.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate image bundle
        run: |
          set -euo pipefail
          curl -fL 'https://margareth-5-estrategias.floot.app/_cdn/static/50491a77-bbd5-4b6a-a9fa-de0908eeb950-portal-webp-assets.zip' -o /tmp/portal.zip
          echo '5483ddef2ae867eb530e917ab231e538a6719c3fb37bc8398d357991938ce665  /tmp/portal.zip' | sha256sum -c -
          rm -rf /tmp/portal && mkdir -p /tmp/portal
          unzip -q /tmp/portal.zip -d /tmp/portal
          test "$(find /tmp/portal/portal -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 16
          python3 - <<'PY'
          from pathlib import Path
          import struct

          root = Path('/tmp/portal/portal')
          files = sorted(root.glob('*.webp'))
          assert len(files) == 16

          def webp_size(path):
              data = path.read_bytes()
              assert len(data) > 30 and data[:4] == b'RIFF' and data[8:12] == b'WEBP', path
              off = 12
              while off + 8 <= len(data):
                  kind = data[off:off+4]
                  size = struct.unpack_from('<I', data, off+4)[0]
                  payload = data[off+8:off+8+size]
                  if kind == b'VP8X':
                      assert len(payload) >= 10
                      return 1 + int.from_bytes(payload[4:7], 'little'), 1 + int.from_bytes(payload[7:10], 'little')
                  if kind == b'VP8 ':
                      i = payload.find(b'\x9d\x01\x2a')
                      assert i >= 0 and i + 7 <= len(payload)
                      w = int.from_bytes(payload[i+3:i+5], 'little') & 0x3fff
                      h = int.from_bytes(payload[i+5:i+7], 'little') & 0x3fff
                      return w, h
                  if kind == b'VP8L':
                      assert len(payload) >= 5 and payload[0] == 0x2f
                      bits = int.from_bytes(payload[1:5], 'little')
                      return (bits & 0x3fff) + 1, ((bits >> 14) & 0x3fff) + 1
                  off += 8 + size + (size & 1)
              raise AssertionError(f'No decodable WebP size chunk: {path}')

          for path in files:
              size = webp_size(path)
              expected = (1254, 1254) if 'square-' in path.name else (2172, 724)
              assert size == expected, (path.name, size, expected)
              print(f'validated {path.name}: WEBP {size[0]}x{size[1]} {path.stat().st_size} bytes')
          PY
      - name: Copy original WebP binaries
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal
          cp /tmp/portal/portal/*.webp public/assets/portal/
          (cd /tmp/portal/portal && sha256sum *.webp | sort) > /tmp/source.sha256
          (cd public/assets/portal && sha256sum *.webp | sort) > /tmp/repo.sha256
          diff -u /tmp/source.sha256 /tmp/repo.sha256
      - name: Commit images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/portal/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: add validated responsive portal WebP assets'
          git push origin HEAD:main
