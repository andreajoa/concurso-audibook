name: Install portal images
on:
  push:
    paths:
      - '.github/workflows/install-portal-images.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and validate image bundle
        run: |
          set -euo pipefail
          curl -fL 'https://margareth-5-estrategias.floot.app/_cdn/static/50491a77-bbd5-4b6a-a9fa-de0908eeb950-portal-webp-assets.zip' -o /tmp/portal.zip
          echo '5483ddef2ae867eb530e917ab231e538a6719c3fb37bc8398d357991938ce665  /tmp/portal.zip' | sha256sum -c -
          rm -rf /tmp/portal && mkdir -p /tmp/portal
          unzip -q /tmp/portal.zip -d /tmp/portal
          test "$(find /tmp/portal/portal -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 16
          file /tmp/portal/portal/*.webp | grep -c 'Web/P image' | grep -q '^16$'
          test "$(file /tmp/portal/portal/portal-hero-*.webp | grep -c '2172x724')" -eq 4
          test "$(file /tmp/portal/portal/portal-square-*.webp | grep -c '1254x1254')" -eq 4
          test "$(file /tmp/portal/portal/portal-strip-*.webp /tmp/portal/portal/portal-top-*.webp | grep -c '2171+1x723+1')" -eq 8
      - name: Copy original WebP binaries
        run: |
          set -euo pipefail
          mkdir -p public/assets/portal
          cp /tmp/portal/portal/*.webp public/assets/portal/
          (cd /tmp/portal/portal && sha256sum *.webp | sort) > /tmp/source.sha256
          (cd public/assets/portal && sha256sum *.webp | sort) > /tmp/repo.sha256
          diff -u /tmp/source.sha256 /tmp/repo.sha256
      - name: Commit images
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/portal/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'perf: add validated responsive portal WebP assets'
          git push origin HEAD:main
