name: Verify portal images
on:
  workflow_dispatch:
  push:
    paths:
      - 'public/assets/portal/**'
      - '.github/workflows/install-portal-images.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portal WebP assets
        run: |
          set -euo pipefail
          count="$(find public/assets/portal -maxdepth 1 -type f -name '*.webp' | wc -l)"
          test "$count" -ge 16
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('public/assets/portal').glob('*.webp'))
          assert len(files) >= 16
          for path in files:
              data = path.read_bytes()
              assert len(data) > 20, path
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', path
          print(f'validated {len(files)} WebP portal assets')
          PY
