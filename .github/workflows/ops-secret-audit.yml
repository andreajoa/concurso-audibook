name: Ops integration readiness audit

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ops-secret-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured integrations
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          present() { if [ -n "$2" ]; then echo "$1=true"; else echo "$1=false"; fi; }
          present VERCEL_TOKEN "$VERCEL_TOKEN"
          present VERCEL_ORG_ID "$VERCEL_ORG_ID"
          present VERCEL_PROJECT_ID "$VERCEL_PROJECT_ID"
          present R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          present R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          present CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          present STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          present STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          present STRIPE_PUBLISHABLE_KEY "$STRIPE_PUBLISHABLE_KEY"
          present NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY"
          present RESEND_API_KEY "$RESEND_API_KEY"
