name: Generate audiobook to Cloudflare R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_audiobook.py"
      - ".github/workflows/generate-audiobook.yml"

permissions:
  contents: read

concurrency:
  group: generate-audiobook
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_AI_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests boto3 pypdf pymupdf piper-tts

      - name: Generate Brazilian Portuguese chapters and upload to R2
        run: python scripts/generate_audiobook.py
