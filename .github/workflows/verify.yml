name: Verify study library

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify project
        run: npm run verify
      - name: Verify public R2 access is disabled
        shell: bash
        run: |
          set -u
          urls=(
            "https://pub-7783b168338945eebb519768f0dbd176.r2.dev/docs/apostila-autores-ibam-santos-2026.pdf"
            "https://pub-7783b168338945eebb519768f0dbd176.r2.dev/audio/pt-br-v2/01-mapa-mae.mp3"
          )
          for url in "${urls[@]}"; do
            set +e
            code=$(curl -L -sS -o /dev/null -w "%{http_code}" --max-time 15 "$url")
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "FAIL public paid asset is still reachable: $url (HTTP $code)"
              exit 1
            fi
            echo "OK public access blocked: $url (curl=$rc http=${code:-000})"
          done
      - name: Verify paid R2 assets with authenticated S3
        run: npm run verify:remote
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: dbad4dc0550693a69d5956df7344e001
          R2_BUCKET: apostila
      - name: Build static output
        run: npm run build
