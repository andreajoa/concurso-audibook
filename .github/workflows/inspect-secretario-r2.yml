name: Inspect Secretario R2

on:
  push:
    branches: [ops/secretario-unidade-escolar-2026]
    paths:
      - ".github/workflows/inspect-secretario-r2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q boto3
      - name: List matching R2 objects
        run: |
          python - <<'PY'
          import os, boto3
          from botocore.config import Config
          account='dbad4dc0550693a69d5956df7344e001'
          s3=boto3.client('s3',endpoint_url=f'https://{account}.r2.cloudflarestorage.com',region_name='auto',aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],config=Config(signature_version='s3v4'))
          bucket='apostila'
          prefixes=['secretario','secretário','secretario-unidade-escolar','secretario-escolar']
          seen=set()
          for prefix in prefixes:
              r=s3.list_objects_v2(Bucket=bucket,Prefix=prefix)
              for x in r.get('Contents',[]):
                  if x['Key'] not in seen:
                      seen.add(x['Key'])
                      print(f"{x['Key']}\t{x['Size']}")
          if not seen: print('NO_MATCHING_OBJECTS')
          PY
