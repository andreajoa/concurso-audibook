name: Generate Redacao audiobook to Cloudflare R2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_redacao_audiobook.py"

permissions:
  contents: read

concurrency:
  group: generate-redacao-audiobook
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests boto3 pypdf pymupdf piper-tts

      - name: Generate cover and Brazilian Portuguese audiobook chapters
        run: python scripts/generate_redacao_audiobook.py
