name: Sync embedded payment public key

on:
  push:
    branches: [cover-binary-fix]
    paths: ['.github/workflows/sync-payment-key.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cover-binary-fix
      - name: Read public key from existing embedded checkout
        run: |
          set -euo pipefail
          curl -fsS 'https://apostila-promo.vercel.app/api/config' -o /tmp/payment-config.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/payment-config.json','utf8'));
          const key=String(data.publishableKey||'').trim();
          if(!/^pk_(live|test)_/.test(key)) throw new Error('Public payment key not available from reference checkout');
          fs.writeFileSync('lib/payment-public-key.js',`module.exports = ${JSON.stringify(key)};\n`);
          NODE
      - name: Commit public key and remove temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/sync-payment-key.yml
          git add lib/payment-public-key.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'config: reuse public key for embedded payment'
          git push origin HEAD:cover-binary-fix
