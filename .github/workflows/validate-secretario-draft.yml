name: Validate Secretario staged product

on:
  push:
    branches:
      - ops/secretario-unidade-escolar-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON definitions and R2 key isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          slug='secretario-de-unidade-escolar-ibam-santos-2026'
          product=json.loads(Path('products/secretario-product.draft.json').read_text())[slug]
          spec=json.loads(Path('products/secretario-media-sources.json').read_text())[slug]
          assert product['slug']==slug
          assert product['priceCents']==2499
          assert len(product['assets']['chapters'])==8
          keys=[product['assets']['coverKey'],product['assets']['pdfKey'],product['assets']['summary']['key'],*[x['key'] for x in product['assets']['chapters']]]
          assert len(keys)==11 and len(set(keys))==11
          assert all(k.startswith(slug + '/') and '..' not in k for k in keys)
          ranges=[tuple(x) for x in spec['chapterRanges']]
          covered=[p for a,b in ranges for p in range(a,b+1)]
          expected=[p for p in range(1,spec['pageCount']+1) if p not in set(spec['excludedPages'])]
          assert covered==expected
          assert (spec['coverWidth'],spec['coverHeight'])==(1086,1448)
          assert len(spec['pdfSha256'])==len(spec['coverSha256'])==len(spec['summarySha256'])==64
          print('Secretario staged definition validated: 11 isolated R2 keys, 8 chapters, exact page coverage.')
          PY
      - name: Compile hardened publisher
        run: python -m py_compile scripts/publish_secretario_media.py
      - name: Ensure paid product is not activated before media publication
        run: |
          python - <<'PY'
          import json
          catalog=json.load(open('products/catalog.json'))
          assert 'secretario-de-unidade-escolar-ibam-santos-2026' not in catalog, 'Do not activate before R2 publication'
          print('Catalog safety gate OK: product remains staged only.')
          PY
